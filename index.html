<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاکتوراپ - فاکتور ساز پیشرفته</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#B78C2E">
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Libraries: html2canvas & jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color, #F5F1E8);
            color: var(--text-color, #1f2937);
        }
        .theme-classic { --bg-color: #F5F1E8; --primary-color: #B78C2E; --secondary-color: #0F4C3C; }
        .theme-minimal-gray { --bg-color: #f3f4f6; --primary-color: #4b5563; --secondary-color: #1f2937; }
        .theme-minimal-blue { --bg-color: #eff6ff; --primary-color: #3b82f6; --secondary-color: #1e3a8a; }
        .theme-classic-crimson { --bg-color: #fdf2f2; --primary-color: #991b1b; --secondary-color: #7f1d1d; }
        .theme-traditional-gold { --bg-color: #fefce8; --primary-color: #ca8a04; --secondary-color: #1e3a8a; }
        .theme-luxurious { --bg-color: #111827; --primary-color: #d97706; --secondary-color: #374151; color: #f9fafb; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
    </style>
</head>
<body id="body-root" class="theme-classic min-h-screen flex flex-col justify-between selection:bg-amber-200">

    <!-- Top Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-xs">
        <div class="flex items-center gap-3 cursor-pointer" id="logo-header-click">
            <div class="w-10 h-10 rounded-full bg-amber-50 border border-amber-200 flex items-center justify-center font-bold text-amber-700 shadow-inner">F</div>
            <div>
                <h1 class="font-bold text-base tracking-tight flex items-center gap-2">
                    فاکتوراپ <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">فعال</span>
                </h1>
                <p class="text-[11px] text-gray-500">نسخه مادام‌العمر</p>
            </div>
        </div>
        <div class="bg-amber-50 border border-amber-200/60 px-3 py-1 rounded-xl text-xs font-medium text-amber-900 shadow-2xs" id="shamsi-date-box">
            تاریخ امروز
        </div>
        <div class="text-left">
            <span class="text-xs font-bold text-gray-700 block">ver 23.1</span>
            <span class="text-[10px] text-gray-400">Created by Grok</span>
        </div>
    </header>

    <!-- Sub-Header Top Navigation (Visible in sub-pages) -->
    <nav id="top-nav-bar" class="bg-amber-100/60 border-b border-amber-200/80 px-4 py-2 flex justify-between items-center text-xs font-bold text-amber-900 hidden">
        <button onclick="router.back()" class="hover:text-amber-700 flex items-center gap-1 cursor-pointer bg-white/80 px-3 py-1 rounded-lg border border-amber-200 shadow-2xs">
            ‹ بازگشت
        </button>
        <button onclick="router.navigate('home')" class="hover:text-amber-700 flex items-center gap-1 cursor-pointer bg-white/80 px-3 py-1 rounded-lg border border-amber-200 shadow-2xs">
            🏠 صفحه اصلی
        </button>
    </nav>

    <!-- Main Container -->
    <main id="app-container" class="flex-1 max-w-4xl w-full mx-auto p-4 pb-20">
        <!-- Dynamic Views -->
    </main>

    <!-- Bottom Navigation Bar -->
    <footer class="bg-white/90 backdrop-blur-md border-t border-gray-200 py-2 px-4 text-center text-xs text-gray-600 fixed bottom-0 left-0 right-0 z-30 flex justify-between items-center shadow-lg">
        <button onclick="router.navigate('home')" class="hover:text-amber-700 font-bold flex items-center gap-1 cursor-pointer bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200">
            🏠 صفحه اصلی
        </button>
        <span id="footer-version-label" class="text-[11px] text-gray-400">Created by Grok . ver 23.1</span>
        <button onclick="router.back()" class="hover:text-amber-700 font-bold flex items-center gap-1 cursor-pointer bg-gray-100 px-3 py-1.5 rounded-xl border border-gray-200">
            ‹ بازگشت
        </button>
    </footer>

    <script>
        const DB = {
            get(key, defaultVal = null) {
                const val = localStorage.getItem(key);
                return val ? JSON.parse(val) : defaultVal;
            },
            set(key, val) {
                localStorage.setItem(key, JSON.stringify(val));
            }
        };

        // Initialize DB items
        if (!DB.get('profiles')) DB.set('profiles', [{}, {}]);
        if (!DB.get('activeProfileIndex')) DB.set('activeProfileIndex', 0);
        if (!DB.get('customers')) DB.set('customers', [{name: 'علی احمدی', phone: '09123456789', address: 'تهران'}]);
        if (!DB.get('products')) DB.set('products', [{name: 'محصول نمونه', sellPrice: 150000, stock: 10}]);
        if (!DB.get('invoices')) DB.set('invoices', []);
        if (!DB.get('settings')) DB.set('settings', { theme: 'theme-classic', currency: 'تومان' });

        function applySavedTheme() {
            const settings = DB.get('settings');
            const body = document.getElementById('body-root');
            if (body && settings && settings.theme) {
                body.className = `${settings.theme} min-h-screen flex flex-col justify-between selection:bg-amber-200`;
            }
        }

        function getShamsiToday() {
            try {
                return new Intl.DateTimeFormat('fa-IR', { dateStyle: 'full' }).format(new Date());
            } catch {
                return '۱۴۰۵/۰۸/۱۴';
            }
        }
        document.getElementById('shamsi-date-box').innerText = getShamsiToday();

        // Mobile Hardware Back Button Router Integration
        const router = {
            history: ['home'],
            current: 'home',
            currentParams: {},
            navigate(viewName, params = {}, isPopState = false) {
                if (!isPopState) {
                    this.history.push(viewName);
                    window.history.pushState({ view: viewName, params: params }, '', `#${viewName}`);
                }
                this.current = viewName;
                this.currentParams = params;
                this.render();
                window.scrollTo(0, 0);
            },
            back() {
                if (this.history.length > 1) {
                    window.history.back();
                } else {
                    if (confirm('می‌خواهید از برنامه خارج شوید؟')) {
                        window.close();
                    }
                }
            },
            render() {
                applySavedTheme();
                const container = document.getElementById('app-container');
                const topNav = document.getElementById('top-nav-bar');
                
                // Show/Hide top navbar for sub-pages
                if (this.current === 'home') {
                    topNav.classList.add('hidden');
                } else {
                    topNav.classList.remove('hidden');
                }

                if (this.current === 'home') {
                    container.innerHTML = `
                        <div class="space-y-4 animate-fadeIn">
                            <div class="bg-gradient-to-r from-amber-500 to-amber-700 text-white p-4 rounded-2xl shadow-md flex items-center justify-between">
                                <div>
                                    <h2 class="font-bold text-lg">خوش آمدید!</h2>
                                    <p class="text-xs text-amber-100 mt-1">مدیریت فاکتورها و کسب‌وکار به ساده‌ترین شکل ممکن</p>
                                </div>
                                <span class="text-3xl">💼</span>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                <button onclick="router.navigate('new-invoice')" class="bg-amber-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-amber-700 transition">
                                    <span class="text-2xl">📄</span>
                                    <span class="font-semibold text-sm">فاکتور جدید</span>
                                </button>
                                <button onclick="router.navigate('invoices-list')" class="bg-emerald-700 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-emerald-800 transition">
                                    <span class="text-2xl">📑</span>
                                    <span class="font-semibold text-sm">لیست فاکتورها</span>
                                </button>
                                <button onclick="router.navigate('customers')" class="bg-blue-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-blue-700 transition">
                                    <span class="text-2xl">👥</span>
                                    <span class="font-semibold text-sm">مشتریان</span>
                                </button>
                                <button onclick="router.navigate('products')" class="bg-purple-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-purple-700 transition">
                                    <span class="text-2xl">📦</span>
                                    <span class="font-semibold text-sm">کالا و خدمات</span>
                                </button>
                                <button onclick="router.navigate('profiles')" class="bg-cyan-700 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-cyan-800 transition">
                                    <span class="text-2xl">👤</span>
                                    <span class="font-semibold text-sm">پروفایل فروشنده</span>
                                </button>
                                <button onclick="router.navigate('settings')" class="bg-gray-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-gray-700 transition">
                                    <span class="text-2xl">⚙️</span>
                                    <span class="font-semibold text-sm">تنظیمات و پوسته‌ها</span>
                                </button>
                            </div>
                        </div>
                    `;
                } else if (this.current === 'new-invoice') {
                    const customers = DB.get('customers') || [];
                    const invoices = DB.get('invoices') || [];
                    const nextInvoiceNumber = 1000 + invoices.length + 1;

                    container.innerHTML = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-5">
                            <h2 class="text-lg font-bold text-gray-800 border-b pb-2 flex items-center justify-between">
                                <span class="flex items-center gap-2">📄 صدور فاکتور جدید</span>
                                <button onclick="router.navigate('home')" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-lg text-gray-700 cursor-pointer">🏠 صفحه اصلی</button>
                            </h2>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">انتخاب مشتری</label>
                                    <select id="inv-customer" class="w-full p-3 border rounded-xl text-sm bg-gray-50 outline-none focus:border-amber-600">
                                        <option value="">انتخاب مشتری از لیست...</option>
                                        ${customers.map(c => `<option value="${c.name}">${c.name} (${c.phone || 'بدون تلفن'})</option>`).join('')}
                                    </select>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-600 mb-1">شماره فاکتور</label>
                                        <input type="text" id="inv-number" value="${nextInvoiceNumber}" class="w-full p-3 border rounded-xl text-sm bg-gray-50 outline-none focus:border-amber-600">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-600 mb-1">وضعیت پرداخت</label>
                                        <select id="inv-status" class="w-full p-3 border rounded-xl text-sm bg-gray-50 outline-none focus:border-amber-600">
                                            <option value="تسویه شده">تسویه شده</option>
                                            <option value="تسویه نشده">تسویه نشده (طلب)</option>
                                            <option value="تسویه جزئی">تسویه جزئی</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-3">
                                <div class="flex justify-between items-center">
                                    <h3 class="font-bold text-sm text-gray-700">اقلام فاکتور</h3>
                                    <button onclick="addInvoiceRow()" class="bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-medium cursor-pointer hover:bg-emerald-800">+ افزودن ردیف</button>
                                </div>
                                <div id="invoice-rows" class="space-y-2">
                                    <div class="flex gap-2 items-center bg-gray-50 p-2 rounded-xl border invoice-row-item">
                                        <input type="text" placeholder="شرح کالا یا خدمات" class="flex-1 p-2 border rounded-lg text-xs bg-white item-desc">
                                        <input type="number" value="1" min="1" placeholder="تعداد" class="w-16 p-2 border rounded-lg text-xs bg-white item-qty" oninput="calculateInvoiceTotal()">
                                        <input type="number" value="0" min="0" placeholder="قیمت واحد" class="w-28 p-2 border rounded-lg text-xs bg-white item-price" oninput="calculateInvoiceTotal()">
                                        <span class="text-xs font-bold text-gray-600 w-24 text-center item-sum">۰ تومان</span>
                                        <button onclick="removeInvoiceRow(this)" class="text-red-500 px-2 font-bold cursor-pointer hover:text-red-700">×</button>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-amber-50/50 p-4 rounded-xl border border-amber-200/60 space-y-2 text-sm">
                                <div class="flex justify-between">
                                    <span class="text-gray-600">جمع کل اقلام:</span>
                                    <span id="sub-total-val" class="font-bold">۰ تومان</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-600">تخفیف (تومان):</span>
                                    <input type="number" id="discount-val" value="0" min="0" class="w-32 p-1.5 border rounded-lg text-xs bg-white text-left outline-none focus:border-amber-600" oninput="calculateInvoiceTotal()">
                                </div>
                                <div class="flex justify-between text-base font-bold text-amber-900 border-t pt-2">
                                    <span>مبلغ قابل پرداخت:</span>
                                    <span id="final-total-val">۰ تومان</span>
                                </div>
                            </div>

                            <div class="flex gap-2 pt-2">
                                <button onclick="saveNewInvoice()" class="flex-1 bg-amber-600 text-white py-3 rounded-xl font-bold text-sm cursor-pointer hover:bg-amber-700 shadow-sm">ثبت و ذخیره فاکتور</button>
                                <button onclick="router.back()" class="px-5 bg-gray-200 text-gray-800 py-3 rounded-xl text-sm font-medium cursor-pointer">انصراف / بازگشت</button>
                            </div>
                        </div>
                    `;
                } else if (this.current === 'invoices-list') {
                    const invoices = DB.get('invoices') || [];
                    container.innerHTML = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
                            <div class="flex justify-between items-center border-b pb-3">
                                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">📑 لیست فاکتورها</h2>
                                <button onclick="router.navigate('new-invoice')" class="bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold cursor-pointer hover:bg-amber-700">+ فاکتور جدید</button>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-right text-xs">
                                    <thead>
                                        <tr class="bg-gray-100 text-gray-600 border-b">
                                            <th class="p-3">شماره</th>
                                            <th class="p-3">مشتری</th>
                                            <th class="p-3">تاریخ</th>
                                            <th class="p-3">مبلغ کل</th>
                                            <th class="p-3">وضعیت</th>
                                            <th class="p-3 text-center">عملیات</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${invoices.map((inv, index) => `
                                            <tr class="border-b hover:bg-gray-50 transition">
                                                <td class="p-3 font-bold text-gray-800">#${inv.id || 1000 + index}</td>
                                                <td class="p-3 font-semibold text-gray-700">${inv.customer}</td>
                                                <td class="p-3 text-gray-500">${inv.date || '۱۴۰۵/۰۸/۱۴'}</td>
                                                <td class="p-3 font-bold text-emerald-700">${Number(inv.total || 0).toLocaleString('fa-IR')} تومان</td>
                                                <td class="p-3"><span class="px-2 py-1 rounded-full text-[10px] ${inv.status === 'تسویه شده' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${inv.status || 'تسویه نشده'}</span></td>
                                                <td class="p-3 text-center space-x-2 space-x-reverse">
                                                    <button onclick="router.navigate('preview-invoice', { index: ${index} })" class="text-blue-600 hover:underline cursor-pointer">پیش‌نمایش و دانلود</button>
                                                    <button onclick="deleteInvoice(${index})" class="text-red-600 hover:underline cursor-pointer">حذف</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                            <button onclick="router.back()" class="w-full bg-gray-200 text-gray-800 py-2.5 rounded-xl text-sm font-medium cursor-pointer">‹ بازگشت به صفحه قبلی</button>
                        </div>
                    `;
                } else if (this.current === 'customers') {
                    const customers = DB.get('customers') || [];
                    container.innerHTML = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
                            <div class="flex justify-between items-center border-b pb-3">
                                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">👥 مدیریت مشتریان</h2>
                                <button onclick="router.navigate('home')" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-lg text-gray-700 cursor-pointer">🏠 صفحه اصلی</button>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-right text-xs">
                                    <thead>
                                        <tr class="bg-gray-100 text-gray-600 border-b">
                                            <th class="p-3">نام مشتری</th>
                                            <th class="p-3">شماره موبایل</th>
                                            <th class="p-3">آدرس</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${customers.map(c => `
                                            <tr class="border-b">
                                                <td class="p-3 font-bold">${c.name}</td>
                                                <td class="p-3">${c.phone || '-'}</td>
                                                <td class="p-3">${c.address || '-'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                            <button onclick="router.back()" class="w-full bg-gray-200 text-gray-800 py-2.5 rounded-xl text-sm font-medium cursor-pointer">‹ بازگشت</button>
                        </div>
                    `;
                } else if (this.current === 'products') {
                    const products = DB.get('products') || [];
                    container.innerHTML = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
                            <div class="flex justify-between items-center border-b pb-3">
                                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">📦 کالا و خدمات</h2>
                                <button onclick="router.navigate('home')" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-lg text-gray-700 cursor-pointer">🏠 صفحه اصلی</button>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-right text-xs">
                                    <thead>
                                        <tr class="bg-gray-100 text-gray-600 border-b">
                                            <th class="p-3">نام کالا</th>
                                            <th class="p-3">قیمت فروش</th>
                                            <th class="p-3">موجودی</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${products.map(p => `
                                            <tr class="border-b">
                                                <td class="p-3 font-bold">${p.name}</td>
                                                <td class="p-3">${Number(p.sellPrice || 0).toLocaleString('fa-IR')} تومان</td>
                                                <td class="p-3 font-bold text-blue-600">${p.stock || 0}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                            <button onclick="router.back()" class="w-full bg-gray-200 text-gray-800 py-2.5 rounded-xl text-sm font-medium cursor-pointer">‹ بازگشت</button>
                        </div>
                    `;
                } else if (this.current === 'profiles') {
                    container.innerHTML = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
                            <div class="flex justify-between items-center border-b pb-3">
                                <h2 class="text-lg font-bold text-gray-800">👤 پروفایل فروشنده</h2>
                                <button onclick="router.navigate('home')" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-lg text-gray-700 cursor-pointer">🏠 صفحه اصلی</button>
                            </div>
                            <p class="text-xs text-gray-600">اطلاعات کسب‌وکار و مهر فروشنده در این بخش مدیریت می‌شود.</p>
                            <button onclick="router.back()" class="w-full bg-gray-200 text-gray-800 py-2.5 rounded-xl text-sm font-medium cursor-pointer">‹ بازگشت</button>
                        </div>
                    `;
                } else if (this.current === 'settings') {
                    const settings = DB.get('settings') || { theme: 'theme-classic', currency: 'تومان' };
                    container.innerHTML = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-5">
                            <div class="flex justify-between items-center border-b pb-2">
                                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">⚙️ تنظیمات برنامه و ظاهر</h2>
                                <button onclick="router.navigate('home')" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-lg text-gray-700 cursor-pointer">🏠 صفحه اصلی</button>
                            </div>
                            <div class="space-y-2">
                                <label class="block text-xs font-semibold text-gray-700">انتخاب پوسته برنامه</label>
                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    <button onclick="changeTheme('theme-classic')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer transition ${settings.theme === 'theme-classic' ? 'border-amber-600 bg-amber-50 text-amber-900' : 'bg-gray-50'}">کلاسیک</button>
                                    <button onclick="changeTheme('theme-minimal-gray')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer transition ${settings.theme === 'theme-minimal-gray' ? 'border-gray-600 bg-gray-100 text-gray-900' : 'bg-gray-50'}">مینیمال خاکستری</button>
                                    <button onclick="changeTheme('theme-minimal-blue')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer transition ${settings.theme === 'theme-minimal-blue' ? 'border-blue-600 bg-blue-50 text-blue-900' : 'bg-gray-50'}">مینیمال آبی</button>
                                    <button onclick="changeTheme('theme-classic-crimson')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer transition ${settings.theme === 'theme-classic-crimson' ? 'border-red-600 bg-red-50 text-red-900' : 'bg-gray-50'}">زرشکی</button>
                                    <button onclick="changeTheme('theme-traditional-gold')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer transition ${settings.theme === 'theme-traditional-gold' ? 'border-yellow-600 bg-yellow-50 text-yellow-900' : 'bg-gray-50'}">سنتی</button>
                                    <button onclick="changeTheme('theme-luxurious')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer transition ${settings.theme === 'theme-luxurious' ? 'border-amber-500 bg-gray-900 text-amber-400' : 'bg-gray-50'}">لوکس تیره</button>
                                </div>
                            </div>
                            <button onclick="router.back()" class="w-full bg-gray-200 text-gray-800 py-2.5 rounded-xl text-sm font-medium cursor-pointer">‹ بازگشت</button>
                        </div>
                    `;
                } else if (this.current === 'preview-invoice') {
                    const invoices = DB.get('invoices') || [];
                    const idx = this.currentParams.index !== undefined ? this.currentParams.index : 0;
                    const inv = invoices[idx] || { id: '1001', customer: 'مشتری نمونه', total: 0, items: [] };
                    
                    const profiles = DB.get('profiles') || [{}, {}];
                    const activeIdx = DB.get('activeProfileIndex') || 0;
                    const seller = profiles[activeIdx] || {};

                    container.innerHTML = `
                        <div class="space-y-4">
                            <div id="printable-invoice-card" class="bg-white p-6 rounded-2xl border shadow-md space-y-4 text-xs">
                                <div class="bg-emerald-700 text-white p-3 rounded-xl flex justify-between items-center">
                                    <div>
                                        <h2 class="font-bold text-base">${seller.name || 'فروشگاه آنلاین'}</h2>
                                        <p class="text-[10px] text-emerald-100">${seller.job || 'ارائه‌دهنده خدمات و کالا'}</p>
                                    </div>
                                    <div class="text-left">
                                        <span class="block font-bold">فاکتور فروش #${inv.id}</span>
                                        <span class="text-[10px] opacity-80">${inv.date || '۱۴۰۵/۰۸/۱۴'}</span>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-3 border p-3 rounded-xl bg-gray-50/50">
                                    <div>
                                        <span class="block font-bold text-gray-700">فروشنده:</span>
                                        <p class="text-gray-600">${seller.name || 'نامشخص'}</p>
                                    </div>
                                    <div>
                                        <span class="block font-bold text-gray-700">خریدار:</span>
                                        <p class="text-gray-600">${inv.customer || 'مشتری عمومی'}</p>
                                    </div>
                                </div>

                                <table class="w-full text-right border-collapse">
                                    <thead>
                                        <tr class="bg-gray-100 border-b">
                                            <th class="p-2 border">ردیف</th>
                                            <th class="p-2 border">شرح کالا / خدمات</th>
                                            <th class="p-2 border">تعداد</th>
                                            <th class="p-2 border">قیمت واحد</th>
                                            <th class="p-2 border">مبلغ کل</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${(inv.items || []).map((item, i) => `
                                            <tr class="border-b">
                                                <td class="p-2 border text-center">${i + 1}</td>
                                                <td class="p-2 border font-medium">${item.desc}</td>
                                                <td class="p-2 border text-center">${item.qty}</td>
                                                <td class="p-2 border">${Number(item.price).toLocaleString('fa-IR')} تومان</td>
                                                <td class="p-2 border font-bold text-emerald-700">${Number(item.qty * item.price).toLocaleString('fa-IR')} تومان</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>

                                <div class="flex justify-between items-center border-t pt-3 font-bold text-sm text-gray-800">
                                    <span>مبلغ کل قابل پرداخت:</span>
                                    <span class="text-emerald-700 text-base">${Number(inv.total || 0).toLocaleString('fa-IR')} تومان</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="downloadPDF()" class="bg-amber-600 text-white py-3 rounded-xl font-bold text-sm cursor-pointer hover:bg-amber-700">📥 دریافت PDF</button>
                                <button onclick="router.back()" class="bg-gray-200 text-gray-800 py-3 rounded-xl text-sm font-medium cursor-pointer">‹ بازگشت</button>
                            </div>
                        </div>
                    `;
                }
            }
        };

        // Listen for mobile hardware back button (PopState)
        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.view) {
                router.history.pop();
                router.navigate(event.state.view, event.state.params || {}, true);
            } else {
                router.navigate('home', {}, true);
            }
        });

        // Initialize state on load
        window.history.replaceState({ view: 'home' }, '', '#home');

        function addInvoiceRow() {
            const container = document.getElementById('invoice-rows');
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center bg-gray-50 p-2 rounded-xl border invoice-row-item';
            row.innerHTML = `
                <input type="text" placeholder="شرح کالا یا خدمات" class="flex-1 p-2 border rounded-lg text-xs bg-white item-desc">
                <input type="number" value="1" min="1" placeholder="تعداد" class="w-16 p-2 border rounded-lg text-xs bg-white item-qty" oninput="calculateInvoiceTotal()">
                <input type="number" value="0" min="0" placeholder="قیمت واحد" class="w-28 p-2 border rounded-lg text-xs bg-white item-price" oninput="calculateInvoiceTotal()">
                <span class="text-xs font-bold text-gray-600 w-24 text-center item-sum">۰ تومان</span>
                <button onclick="removeInvoiceRow(this)" class="text-red-500 px-2 font-bold cursor-pointer hover:text-red-700">×</button>
            `;
            container.appendChild(row);
        }

        function removeInvoiceRow(btn) {
            const rows = document.querySelectorAll('.invoice-row-item');
            if (rows.length > 1) {
                btn.parentElement.remove();
                calculateInvoiceTotal();
            }
        }

        function calculateInvoiceTotal() {
            let subTotal = 0;
            const rows = document.querySelectorAll('.invoice-row-item');
            rows.forEach(row => {
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const price = parseFloat(row.querySelector('.item-price').value) || 0;
                const sum = qty * price;
                row.querySelector('.item-sum').innerText = sum.toLocaleString('fa-IR') + ' تومان';
                subTotal += sum;
            });

            const discount = parseFloat(document.getElementById('discount-val').value) || 0;
            const finalTotal = Math.max(0, subTotal - discount);

            document.getElementById('sub-total-val').innerText = subTotal.toLocaleString('fa-IR') + ' تومان';
            document.getElementById('final-total-val').innerText = finalTotal.toLocaleString('fa-IR') + ' تومان';
        }

        function saveNewInvoice() {
            const customer = document.getElementById('inv-customer').value;
            if (!customer) {
                alert('لطفاً نام مشتری را انتخاب کنید.');
                return;
            }

            const number = document.getElementById('inv-number').value.trim();
            const status = document.getElementById('inv-status').value;
            
            let subTotal = 0;
            const items = [];
            const rows = document.querySelectorAll('.invoice-row-item');
            rows.forEach(row => {
                const desc = row.querySelector('.item-desc').value.trim() || 'خدمات / کالا';
                const qty = parseFloat(row.querySelector('.item-qty').value) || 1;
                const price = parseFloat(row.querySelector('.item-price').value) || 0;
                items.push({ desc, qty, price });
                subTotal += (qty * price);
            });

            const discount = parseFloat(document.getElementById('discount-val').value) || 0;
            const total = Math.max(0, subTotal - discount);

            const newInvoice = {
                id: number,
                customer: customer,
                date: '۱۴۰۵/۰۸/۱۴',
                items: items,
                total: total,
                status: status
            };

            const invoices = DB.get('invoices') || [];
            invoices.unshift(newInvoice);
            DB.set('invoices', invoices);

            alert('فاکتور جدید با موفقیت ثبت شد.');
            router.navigate('invoices-list');
        }

        function deleteInvoice(index) {
            if (confirm('آیا از حذف این فاکتور اطمینان دارید؟')) {
                const invoices = DB.get('invoices') || [];
                invoices.splice(index, 1);
                DB.set('invoices', invoices);
                router.render();
            }
        }

        function changeTheme(themeName) {
            const settings = DB.get('settings') || {};
            settings.theme = themeName;
            DB.set('settings', settings);
            applySavedTheme();
            router.render();
        }

        function downloadPDF() {
            const element = document.getElementById('printable-invoice-card');
            html2canvas(element, { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                const imgWidth = 210;
                const imgHeight = canvas.height * imgWidth / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
                pdf.save('factor.pdf');
            });
        }

        router.render();
    </script>
</body>
</html>
