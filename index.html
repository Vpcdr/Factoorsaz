<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاکتوراپ - فاکتور ساز پیشرفته و حرفه‌ای</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#B78C2E">
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Libraries: html2canvas & jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color, #F5F1E8);
            color: var(--text-color, #1f2937);
        }
        .theme-classic { --bg-color: #F5F1E8; --primary-color: #B78C2E; --secondary-color: #0F4C3C; }
        .theme-minimal-gray { --bg-color: #f3f4f6; --primary-color: #4b5563; --secondary-color: #1f2937; }
        .theme-minimal-blue { --bg-color: #eff6ff; --primary-color: #3b82f6; --secondary-color: #1e3a8a; }
        .theme-classic-crimson { --bg-color: #fdf2f2; --primary-color: #991b1b; --secondary-color: #7f1d1d; }
        .theme-traditional-gold { --bg-color: #fefce8; --primary-color: #ca8a04; --secondary-color: #1e3a8a; }
        .theme-luxurious { --bg-color: #111827; --primary-color: #d97706; --secondary-color: #374151; color: #f9fafb; }
        .theme-emerald-night { --bg-color: #022c22; --primary-color: #059669; --secondary-color: #065f46; color: #ecfdf5; }
        .theme-indigo-royal { --bg-color: #1e1b4b; --primary-color: #6366f1; --secondary-color: #4338ca; color: #e0e7ff; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
    </style>
</head>
<body id="body-root" class="theme-classic min-h-screen flex flex-col justify-between selection:bg-amber-200">

    <!-- Top Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-xs">
        <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigate('home')">
            <div class="w-10 h-10 rounded-full bg-amber-50 border border-amber-200 flex items-center justify-center font-bold text-amber-700 shadow-inner">F</div>
            <div>
                <h1 class="font-bold text-base tracking-tight flex items-center gap-2">
                    فاکتوراپ <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">نسخه حرفه‌ای</span>
                </h1>
                <p class="text-[11px] text-gray-500">مدیریت هوشمند کسب‌وکار</p>
            </div>
        </div>
        <div class="bg-amber-50 border border-amber-200/60 px-3 py-1 rounded-xl text-xs font-medium text-amber-900 shadow-2xs" id="shamsi-date-box">
            تاریخ امروز
        </div>
        <div class="text-left">
            <span class="text-xs font-bold text-gray-700 block">ver 23.2</span>
            <span class="text-[10px] text-gray-400">Pro Edition</span>
        </div>
    </header>

    <!-- Sub-Header Top Navigation -->
    <nav id="top-nav-bar" class="bg-amber-100/60 border-b border-amber-200/80 px-4 py-2 flex justify-between items-center text-xs font-bold text-amber-900 hidden">
        <button onclick="router.back()" class="hover:text-amber-700 flex items-center gap-1 cursor-pointer bg-white/80 px-3 py-1 rounded-lg border border-amber-200 shadow-2xs">
            ‹ بازگشت به عقب
        </button>
        <button onclick="router.navigate('home')" class="hover:text-amber-700 flex items-center gap-1 cursor-pointer bg-white/80 px-3 py-1 rounded-lg border border-amber-200 shadow-2xs">
            🏠 صفحه اصلی
        </button>
    </nav>

    <!-- Main Container -->
    <main id="app-container" class="flex-1 max-w-4xl w-full mx-auto p-4 pb-24">
        <!-- Dynamic Views -->
    </main>

    <!-- Bottom Navigation Bar -->
    <footer class="bg-white/90 backdrop-blur-md border-t border-gray-200 py-2.5 px-4 text-center text-xs text-gray-600 fixed bottom-0 left-0 right-0 z-30 flex justify-between items-center shadow-lg">
        <button onclick="router.navigate('home')" class="hover:text-amber-700 font-bold flex items-center gap-1 cursor-pointer bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200">
            🏠 صفحه اصلی
        </button>
        <span id="footer-version-label" class="text-[11px] text-gray-400">Factoorsaz Pro . ver 23.2</span>
        <button onclick="router.back()" class="hover:text-amber-700 font-bold flex items-center gap-1 cursor-pointer bg-gray-100 px-3 py-1.5 rounded-xl border border-gray-200">
            ‹ بازگشت
        </button>
    </footer>

    <script>
        const DB = {
            get(key, defaultVal = null) {
                const val = localStorage.getItem(key);
                return val ? JSON.parse(val) : defaultVal;
            },
            set(key, val) {
                localStorage.setItem(key, JSON.stringify(val));
            }
        };

        // Initialize DB items if empty
        if (!DB.get('profiles')) DB.set('profiles', [
            {name: 'فروشگاه مرکزی', job: 'تجهیزات و خدمات', phone: '09150000000'}, 
            {name: 'خدمات فنی', job: 'تعمیرات تخصصی', phone: '09151111111'}
        ]);
        if (!DB.get('activeProfileIndex')) DB.set('activeProfileIndex', 0);
        if (!DB.get('customers')) DB.set('customers', [
            {name: 'علی احمدی', phone: '09123456789', address: 'تهران، ولیعصر'},
            {name: 'شرکت تجارت نوین', phone: '09198765432', address: 'مشهد، سجاد'}
        ]);
        if (!DB.get('products')) DB.set('products', [
            {name: 'کالای نمونه ۱', code: 'P01', unit: 'عدد', buyPrice: 100000, sellPrice: 150000, stock: 25},
            {name: 'خدمات فنی', code: 'S01', unit: 'ساعت', buyPrice: 0, sellPrice: 300000, stock: 100}
        ]);
        if (!DB.get('invoices')) DB.set('invoices', []);
        if (!DB.get('notes')) DB.set('notes', [{title: 'یادداشت نمونه', text: 'پیگیری فاکتور شماره ۱۰۱'}]);
        if (!DB.get('settings')) DB.set('settings', { theme: 'theme-classic', currency: 'تومان', fontSize: 'text-sm' });

        function applySettings() {
            const settings = DB.get('settings');
            const body = document.getElementById('body-root');
            if (body && settings) {
                body.className = `${settings.theme} min-h-screen flex flex-col justify-between selection:bg-amber-200 ${settings.fontSize || 'text-sm'}`;
            }
        }

        function getShamsiToday() {
            try {
                return new Intl.DateTimeFormat('fa-IR', { dateStyle: 'short' }).format(new Date());
            } catch {
                return '۱۴۰۵/۰۸/۱۴';
            }
        }
        document.getElementById('shamsi-date-box').innerText = getShamsiToday();

        const router = {
            history: ['home'],
            current: 'home',
            currentParams: {},
            navigate(viewName, params = {}, isPopState = false) {
                if (!isPopState) {
                    this.history.push(viewName);
                    window.history.pushState({ view: viewName, params: params }, '', `#${viewName}`);
                }
                this.current = viewName;
                this.currentParams = params;
                this.render();
                window.scrollTo(0, 0);
            },
            back() {
                if (this.history.length > 1) {
                    window.history.back();
                } else {
                    if (confirm('می‌خواهید از برنامه خارج شوید؟')) {
                        window.close();
                    }
                }
            },
            render() {
                applySettings();
                const container = document.getElementById('app-container');
                const topNav = document.getElementById('top-nav-bar');
                
                if (this.current === 'home') {
                    topNav.classList.add('hidden');
                } else {
                    topNav.classList.remove('hidden');
                }

                if (this.current === 'home') {
                    container.innerHTML = `
                        <div class="space-y-4 animate-fadeIn">
                            <div class="bg-gradient-to-r from-amber-500 to-amber-700 text-white p-5 rounded-2xl shadow-md flex items-center justify-between">
                                <div>
                                    <h2 class="font-bold text-lg">سلام، خوش آمدید!</h2>
                                    <p class="text-xs text-amber-100 mt-1">مدیریت کامل فاکتورها، انبار، مشتریان و حسابداری</p>
                                </div>
                                <span class="text-3xl">🚀</span>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                <button onclick="router.navigate('new-invoice')" class="bg-amber-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-amber-700 transition">
                                    <span class="text-2xl">📄</span>
                                    <span class="font-semibold text-sm">فاکتور جدید</span>
                                </button>
                                <button onclick="router.navigate('invoices-list')" class="bg-emerald-700 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-emerald-800 transition">
                                    <span class="text-2xl">📑</span>
                                    <span class="font-semibold text-sm">لیست فاکتورها</span>
                                </button>
                                <button onclick="router.navigate('customers')" class="bg-blue-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-blue-700 transition">
                                    <span class="text-2xl">👥</span>
                                    <span class="font-semibold text-sm">مشتریان</span>
                                </button>
                                <button onclick="router.navigate('products')" class="bg-purple-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-purple-700 transition">
                                    <span class="text-2xl">📦</span>
                                    <span class="font-semibold text-sm">کالا و انبار</span>
                                </button>
                                <button onclick="router.navigate('accounting')" class="bg-teal-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-teal-700 transition">
                                    <span class="text-2xl">📊</span>
                                    <span class="font-semibold text-sm">حسابداری مالی</span>
                                </button>
                                <button onclick="router.navigate('profiles')" class="bg-cyan-700 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-cyan-800 transition">
                                    <span class="text-2xl">👤</span>
                                    <span class="font-semibold text-sm">پروفایل فروشنده</span>
                                </button>
                                <button onclick="router.navigate('notes')" class="bg-indigo-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-indigo-700 transition">
                                    <span class="text-2xl">📝</span>
                                    <span class="font-semibold text-sm">یادآورها و یادداشت</span>
                                </button>
                                <button onclick="router.navigate('backup')" class="bg-rose-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-rose-700 transition">
                                    <span class="text-2xl">💾</span>
                                    <span class="font-semibold text-sm">پشتیبان‌گیری</span>
                                </button>
                                <button onclick="router.navigate('settings')" class="bg-gray-700 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-gray-800 transition">
                                    <span class="text-2xl">⚙️</span>
                                    <span class="font-semibold text-sm">تنظیمات و پوسته‌ها</span>
                                </button>
                            </div>
                        </div>
                    `;
                } else if (this.current === 'profiles') {
                    const profiles = DB.get('profiles') || [{}, {}];
                    const activeIdx = DB.get('activeProfileIndex') || 0;
                    const p = profiles[activeIdx] || {};

                    container.innerHTML = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
                            <div class="flex justify-between items-center border-b pb-3">
                                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">👤 مدیریت پروفایل فروشنده (۲ تب مجزا)</h2>
                            </div>
                            <div class="flex gap-2 border-b pb-3">
                                <button onclick="switchProfileTab(0)" class="px-4 py-2 rounded-xl font-medium text-xs cursor-pointer ${activeIdx === 0 ? 'bg-amber-600 text-white shadow-sm' : 'bg-gray-100 text-gray-700'}">پروفایل ۱</button>
                                <button onclick="switchProfileTab(1)" class="px-4 py-2 rounded-xl font-medium text-xs cursor-pointer ${activeIdx === 1 ? 'bg-amber-600 text-white shadow-sm' : 'bg-gray-100 text-gray-700'}">پروفایل ۲</button>
                            </div>
                            <div class="space-y-3 text-sm">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-600 mb-1">نام فروشگاه / کسب‌وکار</label>
                                        <input type="text" id="prof-name" value="${p.name || ''}" class="w-full p-3 border rounded-xl outline-none focus:border-amber-600" placeholder="مثلا: مولتی تعمیرات">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-600 mb-1">حوزه فعالیت / شغل</label>
                                        <input type="text" id="prof-job" value="${p.job || ''}" class="w-full p-3 border rounded-xl outline-none focus:border-amber-600" placeholder="مثلا: تعمیرات تخصصی">
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-600 mb-1">شماره موبایل</label>
                                        <input type="text" id="prof-phone" value="${p.phone || ''}" class="w-full p-3 border rounded-xl outline-none focus:border-amber-600" placeholder="0915...">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-600 mb-1">شماره کارت بانکی (۱۶ رقمی)</label>
                                        <input type="text" id="prof-card" value="${p.card || ''}" class="w-full p-3 border rounded-xl outline-none focus:border-amber-600" placeholder="6104-...">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">شماره شبا</label>
                                    <input type="text" id="prof-sheba" value="${p.sheba || ''}" class="w-full p-3 border rounded-xl outline-none focus:border-amber-600" placeholder="IR...">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">آدرس دقیق</label>
                                    <textarea id="prof-address" class="w-full p-3 border rounded-xl outline-none focus:border-amber-600" rows="2">${p.address || ''}</textarea>
                                </div>

                                <!-- Image Uploads -->
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t">
                                    <div class="bg-gray-50 p-3 rounded-xl border text-center space-y-2">
                                        <label class="block text-xs font-semibold text-gray-700">لوگوی کسب‌وکار</label>
                                        <div class="w-20 h-20 mx-auto bg-white border rounded-xl flex items-center justify-center overflow-hidden">
                                            <img id="preview-logo" src="${p.logo || ''}" class="w-full h-full object-cover ${p.logo ? '' : 'hidden'}">
                                            <span id="placeholder-logo" class="text-xs text-gray-400 ${p.logo ? 'hidden' : ''}">بدون لوگو</span>
                                        </div>
                                        <input type="file" accept="image/*" onchange="handleImageUpload(event, 'logo')" class="w-full text-[10px] text-gray-500">
                                    </div>
                                    <div class="bg-gray-50 p-3 rounded-xl border text-center space-y-2">
                                        <label class="block text-xs font-semibold text-gray-700">عکس پرسنلی</label>
                                        <div class="w-20 h-20 mx-auto bg-white border rounded-full flex items-center justify-center overflow-hidden">
                                            <img id="preview-avatar" src="${p.avatar || ''}" class="w-full h-full object-cover ${p.avatar ? '' : 'hidden'}">
                                            <span id="placeholder-avatar" class="text-xs text-gray-400 ${p.avatar ? 'hidden' : ''}">بدون عکس</span>
                                        </div>
                                        <input type="file" accept="image/*" onchange="handleImageUpload(event, 'avatar')" class="w-full text-[10px] text-gray-500">
                                    </div>
                                    <div class="bg-gray-50 p-3 rounded-xl border text-center space-y-2">
                                        <label class="block text-xs font-semibold text-gray-700">مهر فروشنده (PNG)</label>
                                        <div class="w-20 h-20 mx-auto bg-white border rounded-xl flex items-center justify-center overflow-hidden">
                                            <img id="preview-stamp" src="${p.stamp || ''}" class="w-full h-full object-contain ${p.stamp ? '' : 'hidden'}">
                                            <span id="placeholder-stamp" class="text-xs text-gray-400 ${p.stamp ? 'hidden' : ''}">بدون مهر</span>
                                        </div>
                                        <input type="file" accept="image/*" onchange="handleImageUpload(event, 'stamp')" class="w-full text-[10px] text-gray-500">
                                    </div>
                                </div>
                                <button onclick="saveProfileData()" class="w-full bg-amber-600 text-white py-3 rounded-xl font-bold cursor-pointer hover:bg-amber-700 shadow-sm">ذخیره پروفایل فروشنده</button>
                            </div>
                        </div>
                    `;
                } else if (this.current === 'products') {
                    const products = DB.get('products') || [];
                    container.innerHTML = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
                            <div class="flex justify-between items-center border-b pb-3">
                                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">📦 مدیریت انبار، کالا و خدمات</h2>
                                <button onclick="openProductModal()" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-bold cursor-pointer hover:bg-purple-700">+ کالای جدید</button>
                            </div>
                            <div>
                                <input type="text" id="search-product" oninput="filterProducts()" placeholder="جستجو بر اساس نام یا کد کالا..." class="w-full p-3 border rounded-xl text-sm outline-none focus:border-purple-600 bg-gray-50">
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-right text-xs">
                                    <thead>
                                        <tr class="bg-gray-100 text-gray-600 border-b">
                                            <th class="p-3">نام کالا / خدمات</th>
                                            <th class="p-3">کد</th>
                                            <th class="p-3">قیمت خرید</th>
                                            <th class="p-3">قیمت فروش</th>
                                            <th class="p-3">موجودی</th>
                                            <th class="p-3 text-center">عملیات</th>
                                        </tr>
                                    </thead>
                                    <tbody id="products-table-body">
                                        ${products.map((p, index) => `
                                            <tr class="border-b hover:bg-gray-50 transition product-row">
                                                <td class="p-3 font-bold text-gray-800 prod-name">${p.name}</td>
                                                <td class="p-3 text-gray-500">${p.code || '-'}</td>
                                                <td class="p-3 text-gray-600">${Number(p.buyPrice || 0).toLocaleString('fa-IR')}</td>
                                                <td class="p-3 font-semibold text-emerald-700">${Number(p.sellPrice || 0).toLocaleString('fa-IR')}</td>
                                                <td class="p-3 font-bold ${p.stock <= 3 ? 'text-red-600' : 'text-blue-600'}">${p.stock || 0} ${p.unit || 'عدد'}</td>
                                                <td class="p-3 text-center space-x-2 space-x-reverse">
                                                    <button onclick="openProductModal(${index})" class="text-blue-600 hover:underline cursor-pointer">ویرایش</button>
                                                    <button onclick="deleteProduct(${index})" class="text-red-600 hover:underline cursor-pointer">حذف</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Product Modal -->
                        <div id="product-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
                            <div class="bg-white w-full max-w-md p-5 rounded-2xl shadow-xl space-y-4">
                                <h3 id="prod-modal-title" class="font-bold text-base text-gray-800 border-b pb-2">افزودن کالا</h3>
                                <input type="hidden" id="edit-prod-index" value="-1">
                                <div class="space-y-3 text-sm">
                                    <div><label class="block text-xs text-gray-600 mb-1">نام کالا *</label><input type="text" id="p-name" class="w-full p-3 border rounded-xl outline-none focus:border-purple-600"></div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div><label class="block text-xs text-gray-600 mb-1">کد کالا</label><input type="text" id="p-code" class="w-full p-3 border rounded-xl outline-none focus:border-purple-600"></div>
                                        <div><label class="block text-xs text-gray-600 mb-1">واحد</label><input type="text" id="p-unit" value="عدد" class="w-full p-3 border rounded-xl outline-none focus:border-purple-600"></div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div><label class="block text-xs text-gray-600 mb-1">قیمت خرید (تومان)</label><input type="number" id="p-buy" value="0" class="w-full p-3 border rounded-xl outline-none focus:border-purple-600"></div>
                                        <div><label class="block text-xs text-gray-600 mb-1">قیمت فروش (تومان)</label><input type="number" id="p-sell" value="0" class="w-full p-3 border rounded-xl outline-none focus:border-purple-600"></div>
                                    </div>
                                    <div><label class="block text-xs text-gray-600 mb-1">موجودی انبار</label><input type="number" id="p-stock" value="10" class="w-full p-3 border rounded-xl outline-none focus:border-purple-600"></div>
                                </div>
                                <div class="flex gap-2 pt-2">
                                    <button onclick="saveProduct()" class="flex-1 bg-purple-600 text-white py-2.5 rounded-xl font-bold cursor-pointer hover:bg-purple-700">ذخیره کالا</button>
                                    <button onclick="closeProductModal()" class="px-4 bg-gray-200 text-gray-800 py-2.5 rounded-xl font-medium cursor-pointer">انصراف</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (this.current === 'customers') {
                    const customers = DB.get('customers') || [];
                    container.innerHTML = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">

                                    <button onclick="changeTheme('theme-classic')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer ${settings.theme === 'theme-classic' ? 'border-amber-600 bg-amber-50' : 'bg-gray-50'}">کلاسیک طلایی</button>
                                    <button onclick="changeTheme('theme-minimal-gray')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer ${settings.theme === 'theme-minimal-gray' ? 'border-gray-600 bg-gray-100' : 'bg-gray-50'}">مینیمال خاکستری</button>
                                    <button onclick="changeTheme('theme-minimal-blue')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer ${settings.theme === 'theme-minimal-blue' ? 'border-blue-600 bg-blue-50' : 'bg-gray-50'}">مینیمال آبی</button>
                                    <button onclick="changeTheme('theme-classic-crimson')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer ${settings.theme === 'theme-classic-crimson' ? 'border-red-600 bg-red-50' : 'bg-gray-50'}">زرشکی کلاسیک</button>
                                    <button onclick="changeTheme('theme-traditional-gold')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer ${settings.theme === 'theme-traditional-gold' ? 'border-yellow-600 bg-yellow-50' : 'bg-gray-50'}">سنتی</button>
                                    <button onclick="changeTheme('theme-luxurious')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer ${settings.theme === 'theme-luxurious' ? 'border-amber-500 bg-gray-900 text-amber-400' : 'bg-gray-50'}">لوکس تیره</button>
                                    <button onclick="changeTheme('theme-emerald-night')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer ${settings.theme === 'theme-emerald-night' ? 'border-emerald-500 bg-emerald-950 text-emerald-200' : 'bg-gray-50'}">زمردی شب</button>
                                    <button onclick="changeTheme('theme-indigo-royal')" class="p-3 border rounded-xl text-xs font-bold cursor-pointer ${settings.theme === 'theme-indigo-royal' ? 'border-indigo-500 bg-indigo-950 text-indigo-200' : 'bg-gray-50'}">سلطنتی بنفش</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-700 mb-1">واحد پول پیش‌فرض</label>
                                    <select id="currency-select" onchange="saveCurrency()" class="w-full p-3 border rounded-xl text-sm bg-gray-50 outline-none">
                                        <option value="تومان" ${settings.currency === 'تومان' ? 'selected' : ''}>تومان</option>
                                        <option value="ریال" ${settings.currency === 'ریال' ? 'selected' : ''}>ریال</option>
                                        <option value="دلار" ${settings.currency === 'دلار' ? 'selected' : ''}>دلار</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-700 mb-1">اندازه قلم (فونت)</label>
                                    <select id="fontsize-select" onchange="saveFontSize()" class="w-full p-3 border rounded-xl text-sm bg-gray-50 outline-none">
                                        <option value="text-xs" ${settings.fontSize === 'text-xs' ? 'selected' : ''}>کوچک و فشرده</option>
                                        <option value="text-sm" ${settings.fontSize === 'text-sm' ? 'selected' : ''}>استاندارد (پیش‌فرض)</option>
                                        <option value="text-base" ${settings.fontSize === 'text-base' ? 'selected' : ''}>بزرگ و خوانا</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        };

        // Hardware back button support
        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.view) {
                router.history.pop();
                router.navigate(event.state.view, event.state.params || {}, true);
            } else {
                router.navigate('home', {}, true);
            }
        });
        window.history.replaceState({ view: 'home' }, '', '#home');

        // Helpers & Handlers
        function switchProfileTab(idx) {
            DB.set('activeProfileIndex', idx);
            router.render();
        }

        let tempImages = {};
        function handleImageUpload(e, type) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                tempImages[type] = ev.target.result;
                const prev = document.getElementById(`preview-${type}`);
                const ph = document.getElementById(`placeholder-${type}`);
                if (prev && ph) {
                    prev.src = ev.target.result;
                    prev.classList.remove('hidden');
                    ph.classList.add('hidden');
                }
            };
            reader.readAsDataURL(file);
        }

        function saveProfileData() {
            const profiles = DB.get('profiles') || [{}, {}];
            const activeIdx = DB.get('activeProfileIndex') || 0;
            profiles[activeIdx] = {
                name: document.getElementById('prof-name').value,
                job: document.getElementById('prof-job').value,
                phone: document.getElementById('prof-phone').value,
                card: document.getElementById('prof-card').value,
                sheba: document.getElementById('prof-sheba').value,
                address: document.getElementById('prof-address').value,
                logo: tempImages.logo !== undefined ? tempImages.logo : (profiles[activeIdx].logo || ''),
                avatar: tempImages.avatar !== undefined ? tempImages.avatar : (profiles[activeIdx].avatar || ''),
                stamp: tempImages.stamp !== undefined ? tempImages.stamp : (profiles[activeIdx].stamp || '')
            };
            DB.set('profiles', profiles);
            tempImages = {};
            alert('پروفایل با موفقیت ذخیره شد.');
            router.navigate('home');
        }

        function openProductModal(index = -1) {
            document.getElementById('edit-prod-index').value = index;
            const modal = document.getElementById('product-modal');
            const title = document.getElementById('prod-modal-title');
            if (index >= 0) {
                const p = (DB.get('products') || [])[index];
                title.innerText = 'ویرایش کالا';
                document.getElementById('p-name').value = p.name || '';
                document.getElementById('p-code').value = p.code || '';
                document.getElementById('p-unit').value = p.unit || 'عدد';
                document.getElementById('p-buy').value = p.buyPrice || 0;
                document.getElementById('p-sell').value = p.sellPrice || 0;
                document.getElementById('p-stock').value = p.stock || 0;
            } else {
                title.innerText = 'افزودن کالای جدید';
                document.getElementById('p-name').value = '';
                document.getElementById('p-code').value = '';
                document.getElementById('p-unit').value = 'عدد';
                document.getElementById('p-buy').value = 0;
                document.getElementById('p-sell').value = 0;
                document.getElementById('p-stock').value = 10;
            }
            modal.classList.remove('hidden');
        }
        function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }

        function saveProduct() {
            const index = parseInt(document.getElementById('edit-prod-index').value);
            const name = document.getElementById('p-name').value.trim();
            if (!name) { alert('نام کالا الزامی است.'); return; }
            const prod = {
                name: name,
                code: document.getElementById('p-code').value.trim(),
                unit: document.getElementById('p-unit').value.trim() || 'عدد',
                buyPrice: parseFloat(document.getElementById('p-buy').value) || 0,
                sellPrice: parseFloat(document.getElementById('p-sell').value) || 0,
                stock: parseFloat(document.getElementById('p-stock').value) || 0
            };
            const products = DB.get('products') || [];
            if (index >= 0) products[index] = prod; else products.push(prod);
            DB.set('products', products);
            closeProductModal();
            router.render();
        }
        function deleteProduct(index) {
            if (confirm('حذف شود؟')) {
                const products = DB.get('products') || [];
                products.splice(index, 1);
                DB.set('products', products);
                router.render();
            }
        }
        function filterProducts() {
            const q = document.getElementById('search-product').value.toLowerCase();
            document.querySelectorAll('.product-row').forEach(row => {
                row.style.display = row.querySelector('.prod-name').innerText.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        function openCustomerModal(index = -1) {
            document.getElementById('edit-cust-index').value = index;
            const modal = document.getElementById('customer-modal');
            const title = document.getElementById('cust-modal-title');
            if (index >= 0) {
                const c = (DB.get('customers') || [])[index];
                title.innerText = 'ویرایش مشتری';
                document.getElementById('c-name').value = c.name || '';
                document.getElementById('c-phone').value = c.phone || '';
                document.getElementById('c-address').value = c.address || '';
            } else {
                title.innerText = 'افزودن مشتری';
                document.getElementById('c-name').value = '';
                document.getElementById('c-phone').value = '';
                document.getElementById('c-address').value = '';
            }
            modal.classList.remove('hidden');
        }
        function closeCustomerModal() { document.getElementById('customer-modal').classList.add('hidden'); }

        function saveCustomer() {
            const index = parseInt(document.getElementById('edit-cust-index').value);
            const name = document.getElementById('c-name').value.trim();
            if (!name) { alert('نام مشتری الزامی است.'); return; }
            const cust = {
                name: name,
                phone: document.getElementById('c-phone').value.trim(),
                address: document.getElementById('c-address').value.trim()
            };
            const customers = DB.get('customers') || [];
            if (index >= 0) customers[index] = cust; else customers.push(cust);
            DB.set('customers', customers);
            closeCustomerModal();
            router.render();
        }
        function deleteCustomer(index) {
            if (confirm('حذف شود؟')) {
                const customers = DB.get('customers') || [];
                customers.splice(index, 1);
                DB.set('customers', customers);
                router.render();
            }
        }
        function filterCustomers() {
            const q = document.getElementById('search-customer').value.toLowerCase();
            document.querySelectorAll('.customer-row').forEach(row => {
                const name = row.querySelector('.cust-name').innerText.toLowerCase();
                const phone = row.querySelector('.cust-phone').innerText.toLowerCase();
                row.style.display = (name.includes(q) || phone.includes(q)) ? '' : 'none';
            });
        }

        function onCustomerSelectChange() {
            const val = document.getElementById('inv-customer-select').value;
            if (val) document.getElementById('inv-customer-name').value = val;
        }

        function onProductRowSelect(selectEl) {
            const selectedOpt = selectEl.options[selectEl.selectedIndex];
            const price = selectedOpt.getAttribute('data-price') || 0;
            const row = selectEl.closest('.invoice-row-item');
            row.querySelector('.item-desc').value = selectEl.value;
            row.querySelector('.item-price').value = price;
            calculateInvoiceTotal();
        }

        function addInvoiceRow() {
            const container = document.getElementById('invoice-rows');
            const products = DB.get('products') || [];
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center bg-gray-50 p-2 rounded-xl border invoice-row-item';
            row.innerHTML = `
                <select class="p-2 border rounded-lg text-xs bg-white item-select" onchange="onProductRowSelect(this)">
                    <option value="">-- انبار --</option>
                    ${products.map(p => `<option value="${p.name}" data-price="${p.sellPrice || 0}">${p.name} (${p.stock || 0})</option>`).join('')}
                </select>
                <input type="text" placeholder="شرح کالا / خدمات" class="flex-1 p-2 border rounded-lg text-xs bg-white item-desc">
                <input type="number" value="1" min="1" placeholder="تعداد" class="w-16 p-2 border rounded-lg text-xs bg-white item-qty" oninput="calculateInvoiceTotal()">
                <input type="number" value="0" min="0" placeholder="قیمت واحد" class="w-28 p-2 border rounded-lg text-xs bg-white item-price" oninput="calculateInvoiceTotal()">
                <span class="text-xs font-bold text-gray-600 w-24 text-center item-sum">۰ تومان</span>
                <button onclick="removeInvoiceRow(this)" class="text-red-500 px-2 font-bold cursor-pointer">×</button>
            `;
            container.appendChild(row);
        }
        function removeInvoiceRow(btn) {
            if (document.querySelectorAll('.invoice-row-item').length > 1) {
                btn.parentElement.remove();
                calculateInvoiceTotal();
            }
        }
        function calculateInvoiceTotal() {
            let sub = 0;
            document.querySelectorAll('.invoice-row-item').forEach(row => {
                const q = parseFloat(row.querySelector('.item-qty').value) || 0;
                const p = parseFloat(row.querySelector('.item-price').value) || 0;
                const sum = q * p;
                row.querySelector('.item-sum').innerText = sum.toLocaleString('fa-IR') + ' تومان';
                sub += sum;
            });
            const disc = parseFloat(document.getElementById('discount-val').value) || 0;
            document.getElementById('sub-total-val').innerText = sub.toLocaleString('fa-IR') + ' تومان';
            document.getElementById('final-total-val').innerText = Math.max(0, sub - disc).toLocaleString('fa-IR') + ' تومان';
        }

        function saveNewInvoice() {
            let custName = document.getElementById('inv-customer-name').value.trim();
            const custPhone = document.getElementById('inv-customer-phone').value.trim();
            const selectVal = document.getElementById('inv-customer-select').value;
            if (!custName && selectVal) custName = selectVal;
            if (!custName) { alert('لطفاً نام مشتری را مشخص کنید.'); return; }

            // Add new customer if not exists
            const customers = DB.get('customers') || [];
            if (!customers.some(c => c.name === custName)) {
                customers.push({ name: custName, phone: custPhone, address: '-' });
                DB.set('customers', customers);
            }

            const items = [];
            let sub = 0;
            const products = DB.get('products') || [];

            let hasError = false;
            document.querySelectorAll('.invoice-row-item').forEach(row => {
                const desc = row.querySelector('.item-desc').value.trim() || 'خدمات';
                const qty = parseFloat(row.querySelector('.item-qty').value) || 1;
                const price = parseFloat(row.querySelector('.item-price').value) || 0;

                // Smart Inventory Deduction
                const prod = products.find(p => p.name === desc);
                if (prod) {
                    if (prod.stock < qty) {
                        alert(`موجودی کالای "${prod.name}" در انبار کافی نیست! (موجودی فعلی: ${prod.stock})`);
                        hasError = true;
                    } else {
                        prod.stock -= qty;
                    }
                }

                items.push({ desc, qty, price });
                sub += (qty * price);
            });

            if (hasError) return;
            DB.set('products', products);

            const disc = parseFloat(document.getElementById('discount-val').value) || 0;
            const newInv = {
                id: document.getElementById('inv-number').value.trim(),
                customer: custName,
                date: document.getElementById('inv-date').value.trim() || getShamsiToday(),
                items: items,
                total: Math.max(0, sub - disc),
                status: document.getElementById('inv-status').value
            };

            const invoices = DB.get('invoices') || [];
            invoices.unshift(newInv);
            DB.set('invoices', invoices);

            alert('فاکتور با موفقیت ثبت شد و از انبار کسر گردید.');
            router.navigate('invoices-list');
        }

        function deleteInvoice(i) {
            if (confirm('حذف فاکتور؟')) {
                const invs = DB.get('invoices') || [];
                invs.splice(i, 1);
                DB.set('invoices', invs);
                router.render();
            }
        }

        function changeTheme(theme) {
            const s = DB.get('settings') || {};
            s.theme = theme;
            DB.set('settings', s);
            applySettings();
            router.render();
        }
        function saveCurrency() {
            const s = DB.get('settings') || {};
            s.currency = document.getElementById('currency-select').value;
            DB.set('settings', s);
        }
        function saveFontSize() {
            const s = DB.get('settings') || {};
            s.fontSize = document.getElementById('fontsize-select').value;
            DB.set('settings', s);
            applySettings();
            router.render();
        }

        function openNoteModal() { document.getElementById('note-modal').classList.remove('hidden'); }
        function saveNote() {
            const title = document.getElementById('note-title').value.trim();
            const text = document.getElementById('note-text').value.trim();
            if (!title) return;
            const notes = DB.get('notes') || [];
            notes.push({ title, text });
            DB.set('notes', notes);
            document.getElementById('note-modal').classList.add('hidden');
            router.render();
        }
        function deleteNote(i) {
            const notes = DB.get('notes') || [];
            notes.splice(i, 1);
            DB.set('notes', notes);
            router.render();
        }

        function downloadPDF() {
            const el = document.getElementById('printable-invoice-card');
            html2canvas(el, { scale: 2 }).then(canvas => {
                const img = canvas.toDataURL('image/png');
                const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                pdf.addImage(img, 'PNG', 0, 0, 210, canvas.height * 210 / canvas.width);
                pdf.save('factor.pdf');
            });
        }
        function printThermal() {
            const content = document.getElementById('printable-invoice-card').innerHTML;
            const win = window.open('', '', 'height=600,width=400');
            win.document.write('<html><head><title>چاپ فیش</title><style>body{font-family:Vazirmatn,sans-serif;direction:rtl;padding:10px;font-size:12px;}</style></head><body>');
            win.document.write(content);
            win.document.write('</body></html>');
            win.document.close();
            win.print();
        }
        function shareWhatsApp() {
            const text = encodeURIComponent('سلام، فاکتور خرید شما از فروشگاه صادر شد. با تشکر از خرید شما.');
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        function exportData() {
            const data = {
                profiles: DB.get('profiles'),
                customers: DB.get('customers'),
                products: DB.get('products'),
                invoices: DB.get('invoices'),
                notes: DB.get('notes'),
                settings: DB.get('settings')
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `factoorsaz-backup-${getShamsiToday().replace(/\//g, '-')}.json`;
            a.click();
        }
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.profiles) DB.set('profiles', data.profiles);
                    if (data.customers) DB.set('customers', data.customers);
                    if (data.products) DB.set('products', data.products);
                    if (data.invoices) DB.set('invoices', data.invoices);
                    if (data.notes) DB.set('notes', data.notes);
                    if (data.settings) DB.set('settings', data.settings);
                    alert('اطلاعات با موفقیت بازیابی شد.');
                    router.navigate('home');
                } catch {
                    alert('فایل پشتیبان نامعتبر است.');
                }
            };
            reader.readAsText(file);
        }

        router.render();
    </script>
</body>
