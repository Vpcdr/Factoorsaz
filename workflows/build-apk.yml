name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Capacitor Android wrapper
        run: |
          cat > package.json <<'EOF'
          {
            "name": "factoorsaz-android-wrapper",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.2.1",
              "@capacitor/core": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vpcdr.factoorsaz",
            "appName": "فاکتوراپ",
            "webDir": "www"
          }
          EOF

          mkdir -p www
          cp index.html manifest.json sw.js www/
          if [ -f icon-192.png ]; then cp icon-192.png www/; fi
          if [ -f icon-512.png ]; then cp icon-512.png www/; fi

          npm install --no-audit --no-fund
          npx cap add android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: factoorsaz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
